name: astrbot

services:
  astrbot:
    image: soulter/astrbot:latest
    container_name: astrbot
    restart: always
    # host 网络：容器内 127.0.0.1 即宿主机回环，可直接访问宿主机上的服务
    network_mode: host
    environment:
      - TZ=Asia/Shanghai
      - ASTRBOT_DASHBOARD_INITIAL_PASSWORD=${ASTRBOT_PASSWORD:?set ASTRBOT_PASSWORD in .env}
    volumes:
      - ./data:/AstrBot/data
